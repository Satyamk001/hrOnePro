<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Warm circle background -->
  <circle cx="16" cy="16" r="15" fill="#f97316"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="11" fill="white" opacity="0.95"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#1c1917" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="21" y2="14" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#f97316"/>
  <!-- Small plus indicator (insights) -->
  <rect x="23" y="21" width="7" height="7" rx="3.5" fill="#f97316"/>
  <line x1="26.5" y1="23" x2="26.5" y2="26" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="25" y1="24.5" x2="28" y2="24.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
</svg>
